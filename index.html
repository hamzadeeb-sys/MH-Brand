<html lang="ar" dir="rtl">

  <title>MH — Official Website</title>

  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Modern UI Polish & Brand Accents */
    :root {
      --mh-orange: #ff6a00;
      --mh-orange-glow: rgba(255, 106, 0, 0.28);
      --card-glass-bg: rgba(255, 255, 255, 0.025);
      --card-glass-hover: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --mh-cool-grey: #94a3b8;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Header Backdrop Blur */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Tagline Glow Badge */
    .hero-tagline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 106, 0, 0.08);
      border: 1px solid rgba(255, 106, 0, 0.3);
      color: var(--mh-orange);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }

    .hero-tagline::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mh-orange);
      box-shadow: 0 0 10px var(--mh-orange);
    }

    /* Luxury Image Wrappers with Brand Orange Border */
    .hero-img-wrap,
    .make-visual-wrap {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--mh-orange);
      box-shadow: 0 20px 45px -15px var(--mh-orange-glow), 0 0 0 1px rgba(255, 106, 0, 0.15);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    .make-visual-wrap:hover {
      transform: translateY(-4px) scale(1.008);
      box-shadow: 0 30px 60px -15px rgba(255, 106, 0, 0.38);
    }

    .make-visual-wrap img {
