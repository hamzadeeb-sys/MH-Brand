<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH — Contact Us</title>
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo-wrap"><img src="Logo.png" alt="MH Logo"></a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link" data-i18n="nav_home">الرئيسية</a></li>
        <li><a href="boxes.html" class="nav-link" data-i18n="nav_boxes">البوكسات</a></li>
        <li><a href="customize.html" class="nav-link" data-i18n="nav_customize">تخصيص الصندوق</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="nav_about">عن البراند</a></li>
        <li><a href="contact.html" class="nav-link active" data-i18n="nav_contact">تواصل معنا</a></li>
      </ul>
      <div class="header-actions">
        <button class="lang-btn">EN</button>
        <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container-narrow">
      <div class="section-header">
        <div class="section-label" data-i18n="contact_label">ابقَ على تواصل</div>
        <h1 class="section-title" data-i18n="contact_title">دعنا نتحدث.</h1>
        <p style="color: var(--mh-cool-grey); margin-top: 8px;" data-i18n="contact_desc">نسعد بتلقي استفساراتك وطلباتك الخاصة مباشرة.</p>
      </div>

      <div class="customizer-wrapper">
        <form onsubmit="sendContactMessage(event)">
          <div class="form-group">
            <label class="form-label" data-i18n="field_name">الاسم الكامل</label>
            <input type="text" id="contactName" class="form-control" data-i18n-ph="field_name_ph" placeholder="أدخل اسمك الكريم" required>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="field_contact">رقم الهاتف أو البريد الإلكتروني</label>
            <input type="text" id="contactInfo" class="form-control" data-i18n-ph="field_contact_ph" placeholder="للتواصل معك" required>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="field_message">نص الرسالة</label>
            <textarea id="contactMsg" class="form-control" rows="4" data-i18n-ph="field_message_ph" placeholder="كيف يمكننا مساعدتك؟" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" data-i18n="btn_send">
            إرسال الرسالة عبر واتساب
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand-box">
        <a href="index.html" class="footer-logo-link"><img src="Logo.png" alt="MH Logo" class="footer-logo-img"></a>
        <p class="footer-slogan" data-i18n="footer_surprise_slogan">اترك المفاجأة علينا</p>
      </div>
      <ul class="footer-links">
        <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
        <li><a href="boxes.html" data-i18n="nav_boxes">البوكسات</a></li>
        <li><a href="customize.html" data-i18n="nav_customize">تخصيص الصندوق</a></li>
        <li><a href="about.html" data-i18n="nav_about">عن البراند</a></li>
        <li><a href="contact.html" data-i18n="nav_contact">تواصل معنا</a></li>
      </ul>
      <div class="footer-social-icons">
        <a href="https://wa.me/963900000000" target="_blank" class="social-icon-btn" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        </a>
        <a href="https://instagram.com/mh_brand" target="_blank" class="social-icon-btn" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      <div data-i18n="footer_rights">جميع الحقوق محفوظة © 2026 MH Brand.</div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
