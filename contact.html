<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH — Let's Talk</title>
  <meta name="description" content="Get in touch with MH Brand. WhatsApp, Instagram, or Direct Message.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/png" href="Logo.png">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo-wrap"><img src="Logo.png" alt="MH Logo"></a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">HOME</a></li>
        <li><a href="boxes.html" class="nav-link">BOXES</a></li>
        <li><a href="customize.html" class="nav-link">CUSTOMIZE</a></li>
        <li><a href="about.html" class="nav-link">ABOUT</a></li>
        <li><a href="contact.html" class="nav-link active">CONTACT</a></li>
      </ul>
      <div class="header-actions">
        <button class="icon-btn" id="cartTriggerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <span class="cart-count" id="cartCountBadge">0</span>
        </button>
        <button class="icon-btn hamburger" id="hamburgerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container-narrow">
      
      <div class="section-header">
        <div class="section-label">Get In Touch</div>
        <h1 style="font-family: var(--font-en); font-size: 38px; letter-spacing: 0.05em;">LET'S TALK.</h1>
      </div>

      <!-- Quick Action Channels -->
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 48px;">
        <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="btn btn-secondary" style="border-color: #25d366; color: #fff;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#25d366"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          WHATSAPP
        </a>
        <a href="https://instagram.com/YOUR_INSTAGRAM_USERNAME" target="_blank" class="btn btn-secondary" style="border-color: #e1306c; color: #fff;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e1306c"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          INSTAGRAM
        </a>
        <a href="mailto:info@mhbrand.com" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          EMAIL
        </a>
      </div>

      <!-- Direct Message Form -->
      <div style="background-color: var(--mh-graphite); border: var(--border-subtle); padding: 36px;">
        <h3 style="margin-bottom: 24px;">أرسل استفسارك مباشرة</h3>
        
        <form onsubmit="event.preventDefault(); alert('تم استلام رسالتك وسنتواصل معك بأسرع وقت.');">
          <div class="form-group">
            <label class="form-label">الاسم الكامل (Name)</label>
            <input type="text" class="form-control" required placeholder="أدخل اسمك الكريم">
          </div>

          <div class="form-group">
            <label class="form-label">رقم الهاتف أو البريد الإلكتروني (Phone / Email)</label>
            <input type="text" class="form-control" required placeholder="للتواصل معك">
          </div>

          <div class="form-group">
            <label class="form-label">نص الرسالة (Message)</label>
            <textarea class="form-control" required placeholder="كيف يمكننا مساعدتك؟"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">SEND MESSAGE</button>
        </form>
      </div>

    </div>
  </main>

  <div class="cart-drawer-overlay" id="cartDrawerOverlay">
    <div class="cart-drawer">
      <div class="cart-header"><span class="cart-title">YOUR CART</span><button class="icon-btn" id="cartCloseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
      <div class="cart-items-body" id="cartItemsList"></div>
      <div class="cart-footer">
        <div class="cart-total-row"><span>Total</span><span id="cartTotalDisplay">$0.00</span></div>
        <button class="btn btn-primary" style="width: 100%;" onclick="MHStore.checkoutWhatsApp('YOUR_PHONE_NUMBER')">CHECKOUT VIA WHATSAPP</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand"><h3>MH</h3><p>One system. Many expressions.</p></div>
      <ul class="footer-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="boxes.html">BOXES</a></li>
        <li><a href="customize.html">CUSTOMIZE</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
      <ul class="footer-links">
        <li><a href="https://instagram.com/YOUR_INSTAGRAM_USERNAME" target="_blank">INSTAGRAM</a></li>
        <li><a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank">WHATSAPP</a></li>
      </ul>
    </div>
    <div class="footer-bottom"><div>&copy; 2026 MH. All Rights Reserved.</div></div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
